name: smart-energy

x-app: &app
  image: ${SMART_ENERGY_IMAGE:-smart-energy-app:latest}
  build: .
  init: true
  environment:
    SECRET_KEY: ${SECRET_KEY:-django-insecure-smart-energy-management-2026-key}
    DEBUG: ${DEBUG:-False}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,testserver}
    DB_NAME: ${DB_NAME:-smart_energy_db}
    DB_USER: ${DB_USER:-smart_energy}
    DB_PASSWORD: ${DB_PASSWORD:-smart_energy_password}
    DB_HOST: db
    DB_PORT: "5432"
    DB_TEST_NAME: ${DB_TEST_NAME:-test_smart_energy_db}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    SMART_ENERGY_DEMO: ${DEMO_MODE:-true}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_CONSUMER_GROUP: s1-ingestion-v1
    SMART_ENERGY_API: http://backend:8000/api

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_energy_db}
      POSTGRES_USER: ${DB_USER:-smart_energy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smart_energy_password}
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql/18/docker within this mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  backend:
    <<: *app
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        set -e
        python backend/manage.py migrate --noinput
        python backend/manage.py bootstrap_demo
        exec gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_MESSAGE_MAX_BYTES: 2000000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  kafka_init:
    image: apache/kafka:4.3.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic energy.readings.raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic energy.readings.dead-letter --partitions 3 --replication-factor 1 --config max.message.bytes=2000000

  telemetry:
    <<: *app
    restart: unless-stopped
    command: ["python", "backend/manage.py", "run_telemetry", "--mode", "kafka"]
    depends_on:
      backend:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
    stop_grace_period: 20s

  consumer:
    <<: *app
    restart: unless-stopped
    command: ["python", "backend/manage.py", "consume_telemetry"]
    depends_on:
      backend:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
    stop_grace_period: 30s

  frontend:
    <<: *app
    restart: unless-stopped
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true", "--browser.gatherUsageStats", "false", "--theme.base", "light"]
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 10s

volumes:
  postgres_data:
  kafka_data:
